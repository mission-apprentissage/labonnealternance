x-default: &default
  deploy:
    resources:
      limits:
        memory: 128m
  restart: always
  networks:
    - mna_network

services:
  mongodb:
    <<: *default
    image: mongodb/mongodb-community-server:8.3.4-ubuntu2204
    hostname: mongodb
    container_name: lba_mongodb
    deploy:
      resources:
        limits:
          memory: 5g
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "127.0.0.1:27017:27017"
    command: ["mongod", "--config", "/etc/mongod/mongod.conf"]
    volumes:
      # Volume nommé (et non plus /opt/app/data/mongodb/db) : l'image community-server
      # tourne en uid 1000, et les données mongo:7 ne sont pas lisibles par un mongod 8.3 —
      # le changement de volume force un départ à vide (les bases preview sont re-seedées
      # au prochain deploy de chaque PR).
      - mongodb_data:/data/db
      - /opt/app/configs/mongodb:/etc/mongod
    healthcheck:
      test: ["CMD", "mongosh", "--eval", '''db.runCommand("ping").ok''', "--quiet"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 30s
    labels:
      - autoheal=true

  # MongoDB Search (self-managed) partagé par toutes les previews : chaque base
  # preview_<PR> déclare ses propres search indexes (yarn cli indexes:recreate).
  mongot:
    # ⚠️ mongot 1.x exige le nouveau format de config (scramAuth) — cf. configs/mongot/mongot.yml.
    image: mongodb/mongodb-community-search:1.70.1
    container_name: lba_mongot
    network_mode: "service:mongodb"
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g -Xms256m"
    deploy:
      resources:
        limits:
          memory: 3g
    volumes:
      - mongot_data:/var/lib/mongot
      - /opt/app/configs/mongot/mongot.yml:/mongot-community/config.default.yml:ro
      - /opt/app/configs/mongot/mongot_password:/etc/mongot/secrets/passwordFile:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy

  # ClamAV désactivé en preview pour économiser 1.5Go de RAM
  # Le scan antivirus n'est pas nécessaire en preview (données de seed uniquement)
  # clamav:
  #   <<: *default
  #   image: clamav/clamav:latest
  #   container_name: lba_clamav
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1.5g
  #   volumes:
  #     - /opt/app/data/clamav:/var/lib/clamav
  #     - /opt/app/configs/clamav/clamd.conf:/etc/clamav/clamd.conf
  #   healthcheck:
  #     test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
  #     interval: 60s
  #     retries: 3
  #     start_period: 6m
  #   labels:
  #     - autoheal=true

  smtp:
    <<: *default
    image: axllent/mailpit:v1.31.4
    container_name: lba_smtp
    ports:
      - 1025:1025
    volumes:
      - /opt/app/data/smtp:/data
      - /opt/app/configs/mailpit/auth:/auth
    environment:
      - MP_DATA_FILE=/data/mailpit.db
      - MP_UI_AUTH_FILE=/auth
      - VIRTUAL_HOST=smtp.{{dns_name}}
      - VIRTUAL_PATH=/
      - VIRTUAL_PORT=8025
      - LETSENCRYPT_HOST=smtp.{{dns_name}}
      - LETSENCRYPT_EMAIL=misson.apprentissage.devops@gmail.com

  metabase:
    <<: *default
    image: metabase/metabase:v0.64.3.4
    container_name: lba_metabase
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      JAVA_OPTS: "-Xmx512m"
      JAVA_TIMEZONE: Europe/Paris
      MB_SITE_LOCALE: fr
      MB_SITE_URL: "https://metabase.{{dns_name}}"
      MB_ENCRYPTION_SECRET_KEY: "{{ LBA_METABASE_ENCRYPTION_SECRET_KEY }}"
      MB_PASSWORD_COMPLEXITY: normal
      MB_START_OF_WEEK: monday
      VIRTUAL_HOST: "metabase.{{dns_name}}"
      VIRTUAL_PATH: /
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: "metabase.{{dns_name}}"
      LETSENCRYPT_EMAIL: misson.apprentissage.devops@gmail.com
    volumes:
      - metabase:/metabase.db
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 6m
    labels:
      - autoheal=true

volumes:
  metabase:
  mongodb_data:
  mongot_data:

networks:
  mna_network:
    name: mna_network
    external: true
