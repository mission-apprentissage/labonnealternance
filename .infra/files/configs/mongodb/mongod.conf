net:
  bindIpAll: true

storage:
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2

replication:
  replSetName: replica

security:
  keyFile: /etc/mongod/mongo_keyfile.txt

# MongoDB Search : mongot partage le namespace réseau du conteneur mongodb
# (network_mode service:mongodb) → joignable en localhost.
setParameter:
  searchIndexManagementHostAndPort: localhost:27028
  mongotHost: localhost:27028
  skipAuthenticationToSearchIndexManagementServer: true
  useGrpcForSearch: true
