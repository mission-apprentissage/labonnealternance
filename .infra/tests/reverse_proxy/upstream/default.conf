# UI factice : répond 200 à tout. Un 404 vu par le test vient donc du reverse proxy, jamais de l'amont.
server {
    listen 3000;

    # En-têtes d'un asset Next versionné, pour que le cache proxy le stocke.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        return 200 "asset\n";
    }

    location / {
        add_header Cache-Control "private, no-cache, no-store" always;
        return 200 "page\n";
    }
}
