---
- name: "[{{ pr_number }}] Get Pull Request Infos"
  ansible.builtin.shell: curl -s https://api.github.com/repos/mission-apprentissage/{{repo_name}}/pulls/{{ pr_number }}
  register: result

- name: "[{{ pr_number }}] Save Pull Requests Infos"
  set_fact:
    pr_commit_id: "{{ result.stdout | from_json | json_query('head.sha') }}"
    pr_title: "{{ result.stdout | from_json | json_query('title') }}"
    pr_state: "{{ result.stdout | from_json | json_query('state') }}"

- name: "[{{ pr_number }}] Deploying preview"
  when:
    - pr_state == 'open'
    - build == true
  block:
    - name: "[{{ pr_number }}] création du répertoire de build"
      file:
        path: /opt/app/projects/{{ pr_number }}
        state: directory
        owner: root
        group: root
        mode: 770

    - name: "[{{ pr_number }}] copy server env file"
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', '../.env_server') }}"
        dest: "/opt/app/projects/{{ pr_number }}/.env_server"

    - name: "[{{ pr_number }}] copy ui env file"
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', '../.env_ui') }}"
        dest: "/opt/app/projects/{{ pr_number }}/.env_ui"

    - name: "[{{ pr_number }}] creation du fichier docker compose"
      ansible.builtin.template:
        src: "{{inventory_dir}}/../docker-compose.preview.yml"
        dest: "/opt/app/projects/{{ pr_number }}/docker-compose.yml"

    - name: "Check if repository exists"
      stat:
        path: "/opt/app/projects/{{ pr_number }}/repository"
      register: check_stat

    - name: "Pruning repository references"
      shell:
        chdir: "/opt/app/projects/{{ pr_number }}/repository"
        cmd: git remote prune origin
      when: check_stat.stat.exists

    - name: "[{{ pr_number }}] Clone du repository"
      git:
        repo: "git@github.com:mission-apprentissage/{{repo_name}}.git"
        recursive: false
        version: "{{ pr_commit_id }}"
        force: yes
        accept_newhostkey: yes
        dest: "/opt/app/projects/{{ pr_number }}/repository"

    - name: "[{{ pr_number }}] Clone mna-shared-bin submodules"
      shell:
        cmd: "git -C '/opt/app/projects/{{ pr_number }}/repository' submodule update --init .bin/shared"

    - name: "[{{ pr_number }}] Root only pour tous les répertoires applicatifs"
      file:
        path: "{{item}}"
        state: directory
        owner: root
        group: root
        mode: 770
      with_items:
        - "/opt/app/projects/{{ pr_number }}/repository"

    - name: "[{{ pr_number }}] Build local images preview-{{ pr_number }}"
      shell:
        cmd: "flock --verbose --close /tmp/deployment_build.lock .bin/mna app:build preview-{{ pr_number }} load commit-hash-temp preview"
        chdir: "/opt/app/projects/{{ pr_number }}/repository"
      environment:
        CI: "{{ CI | default('true') }}"
      async: 1500 # max 15 minutes
      poll: 15 # check every 15s

    - name: "[{{ pr_number }}] Check if preview is already running"
      stat:
        path: "/opt/app/projects/{{ pr_number }}"
      register: preview_exists

    - name: "[{{ pr_number }}] Stop existing application before deploy"
      shell:
        chdir: "/opt/app/projects/{{ pr_number }}"
        cmd: docker compose down --remove-orphans
      when: preview_exists.stat.exists
      ignore_errors: true

    - name: "[{{ pr_number }}] Check if database is already seeded"
      shell:
        cmd: >
          docker compose -f /opt/app/docker-compose.preview-system.yml exec -T mongodb
          mongosh
          "mongodb://__system:{{ MONGODB_KEYFILE }}@localhost:27017/preview_{{ pr_number }}?authSource=local&directConnection=true"
          --eval "db.getCollectionNames().length"
          --quiet
      register: db_collections_count
      ignore_errors: true

    - name: "[{{ pr_number }}] Seed database"
      shell:
        chdir: "/opt/app"
        cmd: "flock --verbose --timeout 600 --close /tmp/deployment_seed.lock /opt/app/scripts/seed.sh preview_{{ pr_number | default('00') }}"
      async: 1500 # max 20 minutes
      poll: 15 # check every 15s
      when: >
        lookup('env', 'FORCE_SEED') == 'true' or
        db_collections_count.rc != 0 or
        (db_collections_count.stdout | trim | int) == 0

    # L'archive de seed contient admin.system.users : le mongorestore écrase mongotUser
    # avec le mot de passe d'un autre environnement (constaté : mechanisms SCRAM-SHA-1+256
    # au lieu du SCRAM-SHA-256 seul posé par preview.yml) → mongot perd l'auth
    # (« Topology cache is unavailable ») et les search indexes ne se créent plus.
    # Resync systématique depuis le fichier après chaque deploy — idempotent.
    - name: "[{{ pr_number }}] Lire le mot de passe mongot"
      ansible.builtin.slurp:
        src: "/opt/app/configs/mongot/mongot_password"
      register: mongot_password_file
      no_log: true

    - name: "[{{ pr_number }}] Resynchroniser mongotUser après seed"
      no_log: true
      shell:
        cmd: >
          docker exec -e MONGOT_SYNC_VALUE lba_mongodb mongosh
          "mongodb://__system:{{ MONGODB_KEYFILE }}@127.0.0.1:27017/admin?authSource=local&directConnection=true"
          --quiet
          --eval 'try { db.dropUser("mongotUser") } catch (e) {} db.runCommand({ createUser: "mongotUser", pwd: process.env.MONGOT_SYNC_VALUE, roles: [{ role: "searchCoordinator", db: "admin" }], mechanisms: ["SCRAM-SHA-256"] })'
      environment:
        MONGOT_SYNC_VALUE: "{{ mongot_password_file.content | b64decode }}"

    # mongot ne se remet pas seul d'une fenêtre de désauth (constaté : son monitor de
    # topologie reste en « Topology cache is unavailable » même une fois mongotUser
    # resynchronisé, et la création de search indexes échoue en silence) : si le canal
    # de gestion ne répond pas, restart de mongot et attente de son retour AVANT
    # indexes:recreate. Le restart n'a lieu qu'en cas de canal KO (mongot est partagé
    # par toutes les previews).
    - name: "[{{ pr_number }}] Vérifier le canal search indexes (restart mongot si KO)"
      shell:
        cmd: |
          URI="mongodb://__system:{{ MONGODB_KEYFILE }}@127.0.0.1:27017/preview_{{ pr_number }}?authSource=local&directConnection=true"
          check() { docker exec lba_mongodb mongosh "$URI" --quiet --eval 'db.search_items.aggregate([{ $listSearchIndexes: {} }]).toArray().length' >/dev/null 2>&1; }
          if check; then echo "canal search OK"; exit 0; fi
          echo "canal search KO — restart mongot"
          docker restart lba_mongot
          for i in $(seq 1 30); do
            sleep 5
            if check; then echo "canal search OK après restart ($((i * 5))s)"; exit 0; fi
          done
          echo "canal search toujours KO après restart mongot" >&2
          exit 1

    # Crée aussi les MongoDB Search indexes de la base preview_<PR> via le driver
    # (createSearchIndexes) et seed les synonymes — mongot tourne dans preview-system.
    - name: "[{{ pr_number }}] Create MongoDB indexes (before migrations)"
      shell:
        chdir: "/opt/app/projects/{{ pr_number }}"
        cmd: "docker compose run --rm server yarn cli indexes:recreate"
      async: 900 # max 15 minutes
      poll: 15 # check every 15s

    - name: "[{{ pr_number }}] Execute MongoDB migrations"
      shell:
        chdir: "/opt/app/projects/{{ pr_number }}"
        cmd: "docker compose run --rm server yarn cli migrations:up"

    - name: "[{{ pr_number }}] Start Application"
      shell:
        chdir: "/opt/app/projects/{{ pr_number }}"
        cmd: docker compose up -d --remove-orphans --wait

    - name: "[{{ pr_number }}] Trigger ACME companion"
      shell:
        chdir: /opt/app
        cmd: docker exec nginx-proxy-acme /app/signal_le_service

    - name: "[{{ pr_number }}] Register database in Metabase"
      shell:
        cmd: "bash /opt/app/configs/metabase/add-preview-database.sh {{ pr_number }} '{{ LBA_METABASE_MONGODB_URI }}'"
      ignore_errors: true

    - name: "[{{ pr_number }}] Preview URL"
      debug:
        msg: "{{ LBA_PUBLIC_URL }}"

- name: "[{{ pr_number }}] Uninstalling preview"
  when: pr_state != 'open'
  block:
    - name: "[{{ pr_number }}] Check if preview is deployed"
      stat:
        path: "/opt/app/projects/{{ pr_number }}"
      register: check_stat

    - name: "[{{ pr_number }}] Stopping the preview"
      shell:
        chdir: "/opt/app/projects/{{ pr_number }}"
        cmd: docker compose down --remove-orphans	--volumes
      when: check_stat.stat.exists
      ignore_errors: true

    - name: "[{{ pr_number }}] Removing {{ item }}:preview-{{ pr_number }} image"
      shell:
        cmd: "docker image rm -f ghcr.io/mission-apprentissage/{{ item }}:preview-{{ pr_number }}"
      when: check_stat.stat.exists
      loop: "{{ docker_images }}"

    - name: "[{{ pr_number }}] Removing mna_lba_server:{{ pr_number }} channel image"
      shell:
        cmd: "docker image rm -f ghcr.io/mission-apprentissage/mna_lba_server:{{ pr_number }}"
      when: check_stat.stat.exists
      ignore_errors: true

    - name: "[{{ pr_number }}] Remove database from Metabase"
      shell:
        cmd: "bash /opt/app/configs/metabase/remove-preview-database.sh {{ pr_number }}"
      ignore_errors: true

    - name: "[{{ pr_number }}] Remove database"
      shell:
        cmd: >
          docker compose -f /opt/app/docker-compose.preview-system.yml exec -T mongodb
          mongosh
          "mongodb://__system:{{ MONGODB_KEYFILE }}@localhost:27017/preview_{{ pr_number }}?authSource=local&directConnection=true"
          --eval "db.dropDatabase()"
      ignore_errors: true

    - name: "[{{ pr_number }}] Removing preview directory"
      shell:
        cmd: "rm -rf /opt/app/projects/{{ pr_number }}"
      when: check_stat.stat.exists

    - name: "[{{ pr_number }}] Clean Docker"
      shell: docker system prune --force --volumes
