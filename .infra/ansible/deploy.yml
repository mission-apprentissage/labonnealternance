---
- hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Chargement des variables chiffrées globales
      community.sops.load_vars:
        file: "{{ inventory_dir }}/../env.global.yml"
        expressions: ignore

    - name: Chargement des variables chiffrées de l'environnement {{ env_type }}
      community.sops.load_vars:
        file: "{{ inventory_dir }}/../env.{{ env_type }}.yml"
        expressions: ignore

    - include_tasks: ./tasks/files_copy.yml

    - name: Récupération des images docker
      shell:
        chdir: /opt/app
        cmd: "/opt/app/tools/docker-compose.sh pull"

    - name: Récupération du status de la stack
      shell:
        chdir: /opt/app
        cmd: docker stack ls --format json
      register: stack_status

    - name: Récupération du status des migrations
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/scripts/migrations-status.sh"
      register: migration_status_output
      when: stack_status.stdout != ""

    - name: "Shutdown processor"
      shell:
        chdir: /opt/app
        cmd: "sudo docker service scale lba_jobs_processor=0"
      when:
        - stack_status.stdout != ""
        - '"migrations-status=synced" not in migration_status_output.stdout_lines'

    - name: "Activation du mode maintenance pour effectuer la migration"
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/tools/maintenance/maintenance-on.sh"
      when:
        - stack_status.stdout != ""
        - '"migrations-status=require-shutdown" in migration_status_output.stdout_lines'

    - name: "Shutdown server"
      shell:
        chdir: /opt/app
        cmd: "sudo docker service scale lba_server=0"
      when:
        - stack_status.stdout != ""
        - '"migrations-status=require-shutdown" in migration_status_output.stdout_lines'

    - name: Lancement des migrations
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/scripts/migrations-up.sh"
      when:
        - stack_status.stdout != ""
        - '"migrations-status=synced" not in migration_status_output.stdout_lines'
      async: 1800
      poll: 10

    - name: "Create MongoDB Indexes"
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/scripts/sync-index.sh"

    - name: Lancement de l'application {{env_type}}
      shell:
        chdir: /opt/app
        cmd: "/opt/app/tools/update-stack.sh"
      register: docker_deploy_output
      async: 1800
      poll: 10

    - debug:
        var: docker_deploy_output

    - name: Attente du deploiement
      shell:
        chdir: /opt/app
        cmd: "/opt/app/tools/wait-deployment.sh"
      async: 1800
      poll: 10

    # Ceinture-bretelles. Le vrai correctif est dans l'image du reverse proxy
    # (mission-apprentissage/infra, conf.d/cache.conf) : nginx ne stocke plus les réponses
    # document de Next, qui portent un `Cache-Control: s-maxage=31536000` destiné à un CDN purgé
    # à chaque déploiement. Sans ça, le HTML d'une page reste servi un an alors que les chunks JS
    # qu'il référence sont renommés à chaque build → 404 sur les chunks, ChunkLoadError, page
    # jamais hydratée (incident du 2026-09-01 sur /1jeune1solution-recruteurs).
    # Cette purge ne remplace pas le correctif : elle ne couvre pas un `docker service update`
    # manuel, seulement les déploiements passant par ce playbook. Elle borne la fenêtre
    # d'exposition en cas de régression de la conf nginx.
    # `rm -rf /tmp/nginx_cache/*` échoue en « Argument list too long » : le cache est stocké à
    # plat (proxy_cache_path sans `levels=`), d'où le `find -delete`.
    # La purge est volontairement non bloquante. `find -delete` retourne 1 dès qu'une entrée
    # disparaît pendant le parcours, ce que nginx fait en continu sur un proxy qui sert du
    # trafic (reproduit : 5 échecs sur 10 essais avec purges concurrentes). Un échec ferait
    # échouer la tâche après `update-stack.sh`, donc sauterait `reload-proxy.sh`, la sortie du
    # mode maintenance, le renouvellement SSL et le setup Metabase — un prix sans rapport avec
    # l'enjeu, puisque la garantie de correction est la conf nginx, pas cette purge. On trace
    # donc le cas dans la sortie ansible plutôt que de le masquer.
    # Non bloquant ne veut pas dire silencieux : le code retour et la sortie d'erreur sont
    # affichés, et l'absence de conteneur est signalée. « cannot delete … No such file » est la
    # course attendue avec nginx ; tout autre message signale un problème sur le conteneur.
    - name: "Purge du cache du Reverse Proxy"
      shell:
        chdir: /opt/app
        cmd: |
          containers=$(sudo docker ps -q -f name=lba_reverse_proxy)
          if [ -z "$containers" ]; then
            echo "AVERTISSEMENT : aucun conteneur lba_reverse_proxy trouvé, le cache n'a pas été purgé."
          fi
          for containerId in $containers; do
            sortie=$(sudo docker exec "$containerId" find /tmp/nginx_cache -mindepth 1 -delete 2>&1)
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "AVERTISSEMENT : purge incomplète sur $containerId (code $code) : $(echo "$sortie" | head -3)"
            fi
          done

    - name: "Reload du Reverse Proxy"
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/tools/reload-proxy.sh"

    - name: "Désactivation du mode maintenance"
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/tools/maintenance/maintenance-off.sh"

    - name: "Verification des certificats SSL"
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/tools/ssl/renew-certificate.sh {{dns_name}}"

    - name: "Verification des certificats SSL"
      shell:
        chdir: /opt/app
        cmd: "sudo /opt/app/tools/ssl/renew-certificate.sh {{ alias_dns_name }}"
      when: env_type != "preview"

    - name: Add cron to renew pole-emploi cert
      ansible.builtin.cron:
        name: "renew-certificate-pe"
        minute: "0"
        hour: "2"
        weekday: "1"
        job: "bash /opt/app/tools/ssl/renew-certificate.sh {{ alias_dns_name }} >> /var/log/cron.log 2>&1; /opt/app/tools/monitoring/export-cron-status-prom.sh -c 'Renew certificate Alias' -v $?"
      when: env_type == "production"

    - name: "Setup de la Metabase"
      shell:
        chdir: /opt/app
        cmd: "sudo bash /opt/app/configs/metabase/setup-metabase.sh"
      timeout: 86400 # 1 day

    - name: "Prune Docker"
      shell:
        chdir: /opt/app
        cmd: "sudo docker system prune --all --force"
