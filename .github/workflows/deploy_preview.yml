name: Deploy Preview
on:
  issue_comment:
    types: [created]

jobs:
  deploy_preview:
    if: |
      (contains(github.event.comment.body, '🚀') || contains(github.event.comment.body, ':rocket:'))
      && github.event.issue.pull_request
      && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.id }}
      cancel-in-progress: true
    name: Deploy Preview ${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    steps:
      - name: Get Run URL
        id: run_url
        run: echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Comment PR Preview
        if: github.event.issue.state != 'closed'
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          message: |
            ### :rocket: Prévisualisation
            Deploying a new preview, follow progress in ${{ steps.run_url.outputs.url }}
          comment-tag: deployment
          mode: recreate
          pr-number: ${{ github.event.issue.number }}

      - name: React to comment
        uses: dkershner6/reaction-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commentId: ${{ github.event.comment.id }}
          reaction: "+1"

      - id: "get-branch"
        run: echo "branch=$(gh pr view $PR_NO --repo $REPO --json headRefName --jq '.headRefName')" >> $GITHUB_OUTPUT
        env:
          REPO: ${{ github.repository }}
          PR_NO: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.get-branch.outputs.branch }}
          submodules: true

      - name: Create LFS file list
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: LFS Cache
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Git LFS Pull
        run: git lfs pull

      - name: Initialize the GnuPG keyring
        run: |
          echo -n "$OPENPGP_KEY" | gpg --import
        env:
          OPENPGP_KEY: ${{ secrets.OPENPGP_PRIVATE_SUBKEY }}

      - name: Setup SOPS
        uses: nhedger/setup-sops@v3

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          name: github_actions
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          known_hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          config: |
            Host *
              IdentityFile ~/.ssh/github_actions

      - name: Install jmespath
        run: |
          sudo pipx inject ansible-core jmespath

      - name: Detect force reseed
        id: force_seed
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if printf '%s' "$COMMENT_BODY" | grep -qF '🌱'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run playbook
        run: .bin/mna app:deploy preview "${{ github.event.issue.number }}"
        env:
          ANSIBLE_REMOTE_USER: deploy
          ANSIBLE_BECOME_PASS: ${{ secrets.DEPLOY_PASS_PREVIEW }}
          FORCE_SEED: ${{ steps.force_seed.outputs.value }}

      - name: Encrypt logs
        run: .bin/mna app:deploy:log:encrypt
        if: always()

      - name: Upload logs artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ github.event.issue.number }}
          path: /tmp/deploy.log.gpg

      - name: Add Job summary
        if: always()
        run: echo 'You can get logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} ${{ github.event.issue.number }}`' >> $GITHUB_STEP_SUMMARY

      - name: Preview Summary when failed
        if: failure()
        run: echo 'You can get error logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }}`' >> $GITHUB_STEP_SUMMARY

      - name: Preview Summary
        run: echo 'https://${{ github.event.issue.number }}.labonnealternance-preview.apprentissage.beta.gouv.fr/ 🚀' >> $GITHUB_STEP_SUMMARY

      - name: Comment PR Preview
        if: github.event.issue.state != 'closed'
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          message: |
            ### :rocket: ✅ Prévisualisation
            https://${{ github.event.issue.number }}.labonnealternance-preview.apprentissage.beta.gouv.fr/

            You can access runner logs in ${{ steps.run_url.outputs.url }}

            To re-deploy just add a comment with :rocket: (data is preserved)
            To re-deploy and reset data add a comment with :seedling: :rocket:
          comment-tag: deployment
          mode: recreate
          pr-number: ${{ github.event.issue.number }}

      - name: Comment PR Preview when failed
        if: failure() && github.event.issue.state != 'closed'
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          message: |
            ### :ambulance: Prévisualisation failed

            https://${{ github.event.issue.number }}.labonnealternance-preview.apprentissage.beta.gouv.fr/

            You can get error logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }}`
            You can access runner logs in ${{ steps.run_url.outputs.url }}

            To re-deploy just add a comment with :rocket:
          comment-tag: deployment
          mode: recreate
          pr-number: ${{ github.event.issue.number }}

      - name: Comment PR Preview when cancelled
        if: cancelled() && github.event.issue.state != 'closed'
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          message: |
            ### :ambulance: Prévisualisation cancelled

            https://${{ github.event.issue.number }}.labonnealternance-preview.apprentissage.beta.gouv.fr/

            You can access runner logs in ${{ steps.run_url.outputs.url }}

            To re-deploy just add a comment with :rocket:
          comment-tag: deployment
          mode: recreate
          pr-number: ${{ github.event.issue.number }}

  # Job distinct : PROJECT_TOKEN reste hors du runner qui exécute le code de la PR.
  notify_ready_to_test:
    needs: deploy_preview
    if: github.event.issue.state != 'closed'
    name: Notify ready to test ${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Notify linked issues ready to test
        shell: bash
        run: |
          DEPLOY_COMMENT_ID=$(gh api "repos/$OWNER/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- thollander/actions-comment-pull-request \"deployment\" -->")) | .id' \
            | tail -n 1)
          if [ -z "$DEPLOY_COMMENT_ID" ]; then
            echo "::error::Commentaire de déploiement introuvable sur la PR #$PR"
            exit 1
          fi
          DEPLOY_COMMENT=$(gh api "repos/$OWNER/$REPO/issues/comments/$DEPLOY_COMMENT_ID" --jq '.body')

          if ! { [[ "$DEPLOY_COMMENT" == *"🚀"* || "$DEPLOY_COMMENT" == *":rocket:"* ]] && [[ "$DEPLOY_COMMENT" == *"✅"* ]]; }; then
            echo "::warning::Commentaire de déploiement sans 🚀 et ✅, tickets non notifiés"
            exit 0
          fi

          ISSUE_NUMBERS=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 10) {
                    nodes { number }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F pr="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "::warning::Aucun ticket lié à la PR #$PR (Closes #XXX), statut non mis à jour"
            exit 0
          fi

          PREVIEW_URL="https://${PR}.labonnealternance-preview.apprentissage.beta.gouv.fr/"
          FAILED=0
          for ISSUE in $ISSUE_NUMBERS; do
            [[ "$ISSUE" =~ ^[0-9]+$ ]] || continue

            ITEM=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query='
              query($owner: String!, $repo: String!, $issue: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue) {
                    projectItems(first: 100) {
                      nodes {
                        id isArchived project { number }
                        status: fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f repo="$REPO" -F issue="$ISSUE" \
              --jq '[.data.repository.issue.projectItems.nodes[] | select(.project.number == 14) | "\(.id) \(.isArchived) \(.status.name // "")"] | first // empty' || true)

            read -r ITEM_ID ITEM_ARCHIVED ITEM_STATUS <<< "$ITEM"

            if [ "$ITEM_ARCHIVED" = "true" ]; then
              echo "::warning::Issue #$ISSUE → item archivé dans le projet, statut non mis à jour"
              continue
            fi

            if [[ ! "$ITEM_ID" =~ ^PVTI_[A-Za-z0-9_-]+$ ]]; then
              echo "::error::Issue #$ISSUE → item introuvable dans le projet 14"
              FAILED=1
              continue
            fi

            # Un redéploiement ne relance pas la recette ni ne fait reculer un ticket déjà testé ou bloqué.
            case "$ITEM_STATUS" in
              ""|a-faire|en-cours|en-revu-technique) ;;
              *)
                echo "Issue #$ISSUE → statut $ITEM_STATUS conservé, pas de notification"
                continue
                ;;
            esac

            gh issue comment "$ISSUE" --repo "$OWNER/$REPO" --body "### ✅ Prévisualisation disponible
          ${PREVIEW_URL}

          @claire-arnaud-beta @AurelieGonter la PR #${PR} est prête à tester." \
              || { echo "::error::Issue #$ISSUE → échec du commentaire"; FAILED=1; }

            GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId itemId: $itemId fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }' \
              -f projectId="PVT_kwDOA8sl_s4BW3Li" \
              -f itemId="$ITEM_ID" \
              -f fieldId="PVTSSF_lADOA8sl_s4BW3LizhSIG_8" \
              -f optionId="61e4505c" \
              && echo "Issue #$ISSUE → pret-a-tester" \
              || { echo "::error::Issue #$ISSUE → échec de la mise à jour du statut"; FAILED=1; }
          done
          [ $FAILED -eq 0 ] || exit 1
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
