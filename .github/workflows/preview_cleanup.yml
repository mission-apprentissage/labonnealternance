name: Clean Previews
on:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}

jobs:
  cleanup:
    name: Delete expired previews
    runs-on: [self-hosted, deploy-lba]
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
          persist-credentials: false

      - name: Run playbook
        run: .bin/mna preview:cleanup
        env:
          ANSIBLE_REMOTE_USER: deploy-runner
          ANSIBLE_SKIP_GALAXY: "true"
