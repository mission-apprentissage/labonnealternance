name: CI

on:
  workflow_call:
jobs:
  npm-packages-check:
    name: NPM dependency check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v7
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependancies
        run: mna-npm-check/npm-check.sh -p .

  tests:
    if: ${{ success() }}
    needs: ["npm-packages-check"]
    timeout-minutes: 10
    name: "Tests"
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      # mongodb et mongot (~50 s) démarrent pendant l'install, le typecheck et le lint ;
      # l'étape « wait for mongodb / mongot » attend leur fin avant les tests.
      - name: start mongodb / mongot (background)
        run: nohup .github/scripts/ci-start-test-services.sh /tmp/services.exit > /tmp/services.log 2>&1 &

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Make sure to use same dependencies version across all packages
        run: yarn dedupe --check

      - name: typecheck
        run: yarn typecheck

      - name: lint & format
        run: yarn check:ci

      - name: wait for mongodb / mongot
        id: services
        run: |
          timeout 300 bash -c 'until [ -f /tmp/services.exit ]; do sleep 1; done' || { echo "::error::démarrage de mongodb / mongot non terminé après 300 s"; cat /tmp/services.log; exit 1; }
          cat /tmp/services.log
          exit "$(cat /tmp/services.exit)"

      # Un conteneur qui sort au démarrage repasse en « restarting » (restart: unless-stopped) :
      # `--wait` le rapporte « unhealthy » sans sa sortie, d'où l'état et les logs ici.
      - name: diagnostic mongodb / mongot
        if: failure() && steps.services.outcome == 'failure'
        run: |
          uname -r
          docker compose ps -a
          docker compose logs --tail 100 mongodb mongot

      - name: test
        run: yarn test:ci
