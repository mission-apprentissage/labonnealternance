name: Deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        type: choice
        required: true
        options:
          - production
          - recette
          - pentest
      app_version:
        description: app version
        type: string
        required: true
        default: latest
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to
        type: string
        default: latest
        required: false
      app_version:
        description: app version
        type: string
        required: false
        default: latest
    secrets:
      DEPLOY_SSH_PRIVATE_KEY:
        description: SSH private key
        required: true
      DEPLOY_PASS:
        description: SSH PWD TO DEPLOY
        required: true
      SLACK_WEBHOOK:
        description: Slack webhook URL
        required: true
      OPENPGP_PRIVATE_SUBKEY:
        description: Github Actions' OpenPGP private subkey
        required: true
      PROJECT_TOKEN:
        description: Token with project scope for updating GitHub Project items
        required: false

jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - name: Checkout project
        if: ${{ inputs.app_version == 'latest' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Version
        id: get-version
        shell: bash
        run: |
          if [[ "${APP_VERSION}" == "latest" ]]; then
            echo "VERSION=$(git describe --tags --abbrev=0 --candidates 100 --always | cut -c 2-)" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_VERSION: ${{ inputs.app_version }}

  npm-packages-check:
    name: NPM dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v7
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependancies
        run: mna-npm-check/npm-check.sh -p .

  deploy:
    if: ${{ success() }}
    needs: ["version", "npm-packages-check"]
    name: Deploy ${{ needs.version.outputs.VERSION }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Get Action IP
        run: curl -4 ifconfig.me

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true

      - name: Initialize the GnuPG keyring
        run: |
          echo -n "$OPENPGP_KEY" | gpg --import
        env:
          OPENPGP_KEY: ${{ secrets.OPENPGP_PRIVATE_SUBKEY }}

      - name: Setup SOPS
        uses: nhedger/setup-sops@v3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          name: github_actions
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          known_hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          config: |
            Host *
              IdentityFile ~/.ssh/github_actions

      - name: Run playbook
        run: .bin/mna app:deploy ${{ inputs.environment }} --extra-vars "app_version=${{ needs.version.outputs.VERSION }}"
        env:
          ANSIBLE_REMOTE_USER: deploy
          ANSIBLE_BECOME_PASS: ${{ secrets.DEPLOY_PASS }}

      - name: Encrypt logs
        run: .bin/mna app:deploy:log:encrypt
        if: always()

      - name: Upload logs artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ inputs.environment }}
          path: /tmp/deploy.log.gpg

      - name: Add Job summary
        if: always()
        run: echo 'You can get logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.environment }}`' >> $GITHUB_STEP_SUMMARY

      - name: Notify failure on Slack
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          status: failure
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          title: "Le déploiement ${{ needs.version.outputs.VERSION }} en ${{ inputs.environment }} a échoué"
          context: ${{ inputs.environment }}
          details: "You can get error logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.environment }}`"
          mention: "S0693U59FCK"

      - name: Notify success on Slack
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          status: success
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          title: "Déploiement ${{ needs.version.outputs.VERSION }} en ${{ inputs.environment }} terminé avec succès"
          context: ${{ inputs.environment }}

      - name: notify sentry that a new version has been deployed
        run: .bin/mna sentry:deploy ${{ inputs.environment }} ${{ needs.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ env.GITHUB_REF_NAME }}

  changelog:
    if: ${{ success() && inputs.environment == 'production' }}
    needs: ["version", "deploy"]
    name: Post changelog to Slack
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Post changelog to Slack
        shell: bash
        run: |
          CURRENT_TAG="v${{ needs.version.outputs.VERSION }}"

          # Borne basse du changelog : le dernier déploiement en production, lu dans l'API deployments.
          # La liste des runs ne convient pas : servie par un index de recherche, elle renvoie par
          # intermittence un instantané vieux de plusieurs semaines, quel que soit le filtre.
          # `gh api --jq` n'accepte pas --arg, d'où le jq externe.
          DEPLOYMENTS=$(gh api \
            "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=20" \
            | jq -r --arg started "$RUN_STARTED_AT" \
            '.[] | select(.created_at < $started) | "\(.id) \(.sha)"')

          PREV_SHA=""
          while read -r DEPLOY_ID DEPLOY_SHA; do
            [ -n "$DEPLOY_ID" ] || continue
            # Un déploiement en échec n'a rien mis en production : il ne borne pas le changelog.
            STATE=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOY_ID/statuses" \
              --jq 'first(.[].state) // empty')
            if [ "$STATE" = "success" ]; then
              PREV_SHA="$DEPLOY_SHA"
              break
            fi
          done <<< "$DEPLOYMENTS"

          if [ -z "$PREV_SHA" ]; then
            echo "::warning::Aucun déploiement de production antérieur dans les 20 derniers, changelog non publié"
            exit 0
          fi

          if ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Le commit ${PREV_SHA} du déploiement précédent est absent du checkout"
            exit 1
          fi

          # Libellé lisible pour Slack ; la plage git, elle, s'appuie sur le sha exact.
          PREV_LABEL=$(git describe --tags --abbrev=0 "$PREV_SHA" 2>/dev/null || echo "${PREV_SHA:0:9}")

          echo "Fenêtre de changelog : ${PREV_LABEL} (${PREV_SHA:0:9}) → ${CURRENT_TAG} ($(git rev-list --count "${PREV_SHA}..${CURRENT_TAG}") commits)"

          # Transmettre la plage aux steps suivants
          echo "PREV_SHA=${PREV_SHA}" >> "$GITHUB_ENV"
          echo "CURRENT_TAG=${CURRENT_TAG}" >> "$GITHUB_ENV"

          TODAY=$(date +%Y-%m-%d)
          NL=$'\n'

          FEAT_LINES=""
          FIX_LINES=""
          CHORE_LINES=""
          OTHER_LINES=""

          while IFS=$'\t' read -r hash author subject; do
            desc=$(echo "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?: //')
            if echo "$subject" | grep -qE '^feat[\(:]'; then
              FEAT_LINES+="• ${author} - ${desc} (${hash})${NL}"
            elif echo "$subject" | grep -qE '^fix[\(:]'; then
              FIX_LINES+="• ${author} - ${desc} (${hash})${NL}"
            elif echo "$subject" | grep -qE '^chore[\(:]'; then
              CHORE_LINES+="• ${author} - ${desc} (${hash})${NL}"
            else
              OTHER_LINES+="• ${author} - ${subject} (${hash})${NL}"
            fi
          done < <(git log --pretty=format:"%h%x09%an%x09%s" "${PREV_SHA}..${CURRENT_TAG}")

          if [ -z "$FEAT_LINES" ] && [ -z "$FIX_LINES" ] && [ -z "$CHORE_LINES" ] && [ -z "$OTHER_LINES" ]; then
            echo "No commits between ${PREV_LABEL} and ${CURRENT_TAG}, skipping"
            exit 0
          fi

          DIFF_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_SHA}...${CURRENT_TAG}"

          BLOCKS=$(jq -n \
            --arg version "$CURRENT_TAG" \
            --arg prev "$PREV_LABEL" \
            --arg date "$TODAY" \
            '[
              {"type":"header","text":{"type":"plain_text","text":"🚀 Déployé en production — \($version)"}},
              {"type":"section","text":{"type":"mrkdwn","text":"`\($prev)` → `\($version)` · \($date)"}},
              {"type":"divider"}
            ]')

          push_block() {
            BLOCKS=$(echo "$BLOCKS" | jq --arg text "$1" \
              '. + [{"type":"section","text":{"type":"mrkdwn","text":$text}}]')
          }

          # Slack rejette tout le message si une section dépasse 3000 caractères : on répartit les
          # lignes sur autant de sections que nécessaire.
          add_section() {
            local chunk="$1"$'\n' line
            [ -n "$2" ] || return 0
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              if [ $(( ${#chunk} + ${#line} + 1 )) -gt 2900 ]; then
                push_block "$chunk"
                chunk=""
              fi
              chunk+="${line}"$'\n'
            done <<< "$2"
            [ -n "$chunk" ] && push_block "$chunk"
          }

          add_section ':large_green_circle: *Nouvelles fonctionnalités*' "$FEAT_LINES"
          add_section ':red_circle: *Corrections*' "$FIX_LINES"

          BLOCKS=$(echo "$BLOCKS" | jq --arg url "$DIFF_URL" \
            '. + [{"type":"context","elements":[{"type":"mrkdwn","text":"<\($url)|Voir le diff complet →>"}]}]')

          # Slack plafonne un message à 50 blocs.
          BLOCK_COUNT=$(echo "$BLOCKS" | jq 'length')
          if [ "$BLOCK_COUNT" -gt 50 ]; then
            echo "::warning::Changelog tronqué : ${BLOCK_COUNT} blocs pour une limite Slack de 50"
            BLOCKS=$(echo "$BLOCKS" | jq --arg url "$DIFF_URL" \
              '.[0:49] + [{"type":"context","elements":[{"type":"mrkdwn","text":"<\($url)|Changelog tronqué, voir le diff complet →>"}]}]')
            BLOCK_COUNT=$(echo "$BLOCKS" | jq 'length')
          fi

          # Un webhook Slack répond "ok" en texte brut et refuse un payload invalide sans que curl
          # n'échoue : sans ce contrôle, le job sort vert sans avoir rien posté.
          HTTP_CODE=$(jq -n --argjson blocks "$BLOCKS" \
            '{"attachments":[{"color":"#00a95f","blocks":$blocks}]}' \
          | curl -s -o /tmp/slack-response.txt -w '%{http_code}' -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              --data @-)

          SLACK_RESPONSE=$(cat /tmp/slack-response.txt)
          if [ "$HTTP_CODE" != "200" ] || [ "$SLACK_RESPONSE" != "ok" ]; then
            echo "::error::Slack a refusé le changelog (HTTP ${HTTP_CODE}) : ${SLACK_RESPONSE}"
            exit 1
          fi
          echo "Changelog posté sur Slack (${BLOCK_COUNT} blocs)"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_STARTED_AT: ${{ github.run_started_at }}

      - name: Mark linked issues as en-production in GitHub Project
        shell: bash
        run: |
          PR_NUMBERS=$(git log --pretty=format:"%s" "${PREV_SHA}..${CURRENT_TAG}" \
            | grep -oP '\(#\K[0-9]+(?=\))' || true)

          FAILED=0
          for PR in $PR_NUMBERS; do
            ISSUE_NUMBERS=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 10) {
                      nodes { number }
                    }
                  }
                }
              }' -f owner="mission-apprentissage" -f repo="labonnealternance" -F pr="$PR" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' 2>/dev/null || true)

            for ISSUE in $ISSUE_NUMBERS; do
              # Valider que ISSUE est bien un entier pour éviter de passer du JSON d'erreur en paramètre
              [[ "$ISSUE" =~ ^[0-9]+$ ]] || continue

              ITEM=$(gh api graphql -f query='
                query($owner: String!, $repo: String!, $issue: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issue) {
                      projectItems(first: 100) {
                        nodes { id isArchived project { number } }
                      }
                    }
                  }
                }' -f owner="mission-apprentissage" -f repo="labonnealternance" -F issue="$ISSUE" \
                --jq '[.data.repository.issue.projectItems.nodes[] | select(.project.number == 14) | "\(.id) \(.isArchived)"] | first // empty' 2>/dev/null || true)

              ITEM_ID="${ITEM%% *}"

              # Un item archivé ne peut pas être modifié : on le signale sans faire échouer la MEP.
              if [ "${ITEM##* }" = "true" ]; then
                echo "Issue #$ISSUE → item archivé dans le projet, ignoré"
                continue
              fi

              # Si la requête GraphQL a échoué, gh renvoie son JSON d'erreur sur stdout : ne pas
              # le passer en itemId, sinon la mutation échoue avec un message incompréhensible.
              if [[ "$ITEM_ID" =~ ^PVTI_[A-Za-z0-9_-]+$ ]]; then
                gh api graphql -f query='
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId itemId: $itemId fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) { projectV2Item { id } }
                  }' \
                  -f projectId="PVT_kwDOA8sl_s4BW3Li" \
                  -f itemId="$ITEM_ID" \
                  -f fieldId="PVTSSF_lADOA8sl_s4BW3LizhSIG_8" \
                  -f optionId="a9d4a5ea" && echo "Issue #$ISSUE → en-production" || { echo "Issue #$ISSUE → échec mise à jour"; FAILED=1; }
              fi
            done
          done
          [ $FAILED -eq 0 ] || exit 1
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
