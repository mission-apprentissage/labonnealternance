name: TMP mesure CI

# Workflow temporaire de la PR : retiré avant merge.
on:
  pull_request:
    paths:
      - ".github/workflows/tmp-ci-measure.yml"

permissions:
  contents: read

jobs:
  warm-cache:
    name: Cache node_modules (sauvegarde depuis la PR)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "yarn"
      - run: yarn install --immutable
      # Même chemins et même clé que .github/actions/install-dependencies.
      - uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            ui/node_modules
            server/node_modules
            shared/node_modules
            .yarn/install-state.gz
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'yarn.lock', '.yarnrc.yml', '.yarn/releases/**', '.yarn/plugins/**', '.yarn/patches/**', 'package.json', 'ui/package.json', 'server/package.json', 'shared/package.json') }}

  tests-cache-hit:
    name: Tests avec cache node_modules
    needs: warm-cache
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: start mongodb / mongot (background)
        run: nohup .github/scripts/ci-start-test-services.sh /tmp/services.exit > /tmp/services.log 2>&1 &
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Verdict cache
        run: |
          [ -d node_modules ] || { echo "::error::node_modules absent"; exit 1; }
          if [ -d .yarn/cache ]; then echo "::error::cache yarn présent : cache node_modules manqué"; exit 1; fi
          echo "cache node_modules trouvé, yarn install sauté"
      - run: yarn dedupe --check
      - run: yarn typecheck
      - run: yarn check:ci
      - name: wait for mongodb / mongot
        run: |
          timeout 300 bash -c 'until [ -f /tmp/services.exit ]; do sleep 1; done'
          cat /tmp/services.log
          exit "$(cat /tmp/services.exit)"
      - run: yarn test:ci

  ui-build-cache-hit:
    name: Build UI avec cache node_modules
    needs: warm-cache
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - run: test ! -d .yarn/cache
      - run: yarn workspace shared build
      - run: yarn workspace ui build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_ENV: production
          NEXT_PUBLIC_VERSION: 0.0.0-measure
          NODE_OPTIONS: --max-old-space-size=3072

  bake:
    name: Bake ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [production, release]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Bake sans push ni export de cache
        run: |
          nproc; free -m
          ( while true; do free -m | awk '/^Mem:/ { print $3 }' >> /tmp/mem.log; sleep 2; done ) &
          sampler=$!
          docker buildx create --name mna-lba --driver docker-container --config .bin/scripts/buildkitd.toml
          export VERSION=0.0.0-measure CHANNEL=measure COMMIT_HASH="$(git rev-parse HEAD)" DEPS_ID="$(md5sum yarn.lock | cut -d' ' -f1)"
          start=$(date +%s)
          docker buildx bake --builder mna-lba --set '*.output=type=cacheonly' --set '*.cache-to=' "${{ matrix.group }}"
          end=$(date +%s)
          kill "$sampler"
          echo "### Bake ${{ matrix.group }} : $((end - start)) s, pic mémoire $(sort -n /tmp/mem.log | tail -1) Mo / $(free -m | awk '/^Mem:/ { print $2 }') Mo" | tee -a "$GITHUB_STEP_SUMMARY"
